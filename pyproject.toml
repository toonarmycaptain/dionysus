[project]
name = "dionysus"
version = "0.1.0"
description = "Student avatar chart generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.10.8",
    "pillow==12.2.0",
    "sqlalchemy==2.0.49",
]

[dependency-groups]
testing = [
    "coverage==7.13.5",
    "mypy==1.20.0",
    "pre-commit==4.5.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mypy==1.0.1",
    "ruff==0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["dionysus_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# E/F: pyflakes + pycodestyle (default rules)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax for >=3.10)
# B: flake8-bugbear (common pitfalls)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
