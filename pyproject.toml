[project]
name = "dionysus"
version = "0.1.0"
description = "Student avatar chart generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
testing = [
    "coverage==7.14.3",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mypy==1.0.1",
    "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["dionysus_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# E/F: pyflakes + pycodestyle (default rules)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax for >=3.10)
# B: flake8-bugbear (common pitfalls)

[tool.mypy]
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "test_suite.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
