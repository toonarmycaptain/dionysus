name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}  # Continue after failures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]  # These versions must pass.

        include:
            - os: ubuntu-latest
              python-version: 3.15
              experimental: true

#            - os: windows-latest
#              python-version: 3.11-dev
#              experimental: true


    steps:
    - uses: actions/checkout@v4  # Checkout repo.

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Display python version.
      run: python --version --version && which python

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run pre-commit checks
      run: uv run pre-commit run --all-files --show-diff-on-failure

    - name: Test with pytest --cov=./ --mypy -vv
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run pytest --cov=./ --mypy -vv
        uv run coverage xml -i


    - name: Codacy Coverage Reporter
      uses: codacy/codacy-coverage-reporter-action@v1
      if: matrix.os == 'ubuntu_latest'
      with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

    - name: Codecov  # upload
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        name: codecov-umbrella # Optional.
        fail_ci_if_error: false # Allow codecov to signal fail rather than action failing.
        verbose: true # Optional (default = false).
