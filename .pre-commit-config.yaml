repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        always_run: true
    -   id: check-toml
        always_run: true
    -   id: trailing-whitespace
        always_run: true
    -   id: end-of-file-fixer
        always_run: true
    -   id: check-added-large-files
        always_run: true
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.10
  hooks:
    - id: ruff-check
      always_run: true
    - id: ruff-format
      always_run: true
