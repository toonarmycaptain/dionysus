image: Visual Studio 2022
build: false

environment:
  matrix:
    - UV_PYTHON_VERSION: "3.13"
    - UV_PYTHON_VERSION: "3.14"

init:
  - SET PATH=%USERPROFILE%\.local\bin;%PATH%

install:
  - ps: irm https://astral.sh/uv/install.ps1 | iex
  - uv python install %UV_PYTHON_VERSION%
  - uv python list
  - uv sync --all-groups --python %UV_PYTHON_VERSION%

test_script:
  - uv run pytest --cov=./ --mypy -vv
  - uv run coverage xml -i
